# Rolling build of main. The `nightly` tag is moved on every push, so the
# release page always holds exactly one set of development binaries.
name: Nightly

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

# Read for everything by default; the publish job below raises its own to
# `contents: write`, which is the only thing here that needs it.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: nightly

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum oxidezap-* > checksums.sha256)
          cat > notes.md <<'NOTES'
          Unsigned Linux x86_64 (Wayland / X11) development build of `main`.

          Download `oxidezap-nightly-linux-x86_64.tar.gz` and unpack it. It holds
          three binaries that belong together, and they must stay in the same
          directory:

          - `oxidezap` is the window.
          - `oxidezapd` holds the WhatsApp session. The window starts it when
            nothing is already running.
          - `oxidezap-cli` is the scriptable front end onto that same daemon,
            for use from a terminal or a script.

          Run `./install-desktop.sh` from the unpacked directory to register a
          `.desktop` launcher and icon in `~/.local/share/`.
          NOTES
          echo "" >> notes.md
          echo "Built from [\`${GITHUB_SHA:0:7}\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA) on $(date -u +"%Y-%m-%d %H:%M") UTC." >> notes.md
          echo "" >> notes.md
          echo "Verify download integrity with \`sha256sum -c --ignore-missing checksums.sha256\`." >> notes.md
          # Recreate rather than edit: `gh release edit` cannot move a tag, and
          # a stale tag would leave the assets pointing at an older commit.
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly artifacts/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA:0:7})" \
            --notes-file notes.md
